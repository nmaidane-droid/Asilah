<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riad Le Bougainvillier — Asilah</title>
<meta name="description" content="Riad de quatre chambres loué en entier dans l'ancienne médina d'Asilah, Maroc.">
<meta name="theme-color" content="#EFF3EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 5c5 0 9 4 9 9v13H7V14c0-5 4-9 9-9z' fill='%232F7A55'/%3E%3Ccircle cx='16' cy='17' r='3' fill='%23C42B6B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&family=Noto+Sans+SC:wght@400&family=Noto+Sans+JP:wght@400&family=Noto+Sans+Hebrew:wght@400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid; place-items:center; padding:clamp(24px,6vw,56px);
    background:#EFF3EF; color:#14342A; text-align:center;
    font-family:"Jost","Helvetica Neue",Arial,sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  /* la cour, à pleine opacité — aucun voile par-dessus */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:url("photos/cour-fontaine.webp") center/cover no-repeat;
  }
  main{position:relative; z-index:1; max-width:660px; width:100%}
  /* halo blanc derrière le texte : lisible sur la photo, sans l'assombrir */
  .eyebrow{
    text-shadow:0 0 26px rgba(255,255,255,.95), 0 0 10px rgba(255,255,255,.85);
  }
  .eyebrow{
    font-size:.68rem; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(20,52,42,.74); margin:0 0 14px;
  }
  /* le titre reprend le cadre translucide des boutons */
  h1{
    display:block;
    /* même largeur que le bloc des deux colonnes de boutons */
    width:100%; max-width:440px; margin:0 auto;
    font-family:"Marcellus",Georgia,serif; font-weight:400;
    font-size:clamp(1.2rem,4vw,2rem); line-height:1.25;
    letter-spacing:-.005em;
    padding:.6em .8em;
    background:rgba(255,255,255,.62); backdrop-filter:blur(7px);
    border:1px solid rgba(255,255,255,.72); border-radius:2px;
    color:#000000;
  }
  .filet{width:52px;height:2px;background:#C42B6B;margin:clamp(24px,3.2vw,34px) auto}
  /* deux boutons par ligne, quelle que soit la largeur d'écran */
  .langues{display:grid; gap:10px; grid-template-columns:1fr 1fr;
    max-width:440px; margin:0 auto}
  /* boutons translucides : c'est ici que passe la transparence */
  a{
    display:block; padding:1em .8em;
    background:rgba(255,255,255,.62); backdrop-filter:blur(7px);
    border:1px solid rgba(255,255,255,.72); border-radius:2px;
    color:#000000; text-decoration:none; font-size:.92rem; letter-spacing:.04em;
    transition:background 260ms ease, border-color 260ms ease, color 260ms ease;
  }
  a:hover, a:focus-visible{
    background:rgba(20,52,42,.92); border-color:rgba(20,52,42,.92); color:#fff;
  }
  a:focus-visible{outline:2px solid #C42B6B; outline-offset:3px}
  .zh{font-family:"Noto Sans SC","Jost",sans-serif}
  .ja{font-family:"Noto Sans JP","Jost",sans-serif}
  .he{font-family:"Noto Sans Hebrew","Jost",sans-serif; direction:rtl}
  @media (prefers-reduced-motion:reduce){ a{transition:none} }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Asilah · Maroc</p>
    <h1>Riad Le Bougainvillier</h1>
    <div class="filet"></div>
    <nav class="langues">
      <a href="fr.html" hreflang="fr">Français</a>
      <a href="nl.html" hreflang="nl">Nederlands</a>
      <a href="en.html" hreflang="en">English</a>
      <a href="de.html" hreflang="de">Deutsch</a>
      <a href="es.html" hreflang="es">Español</a>
      <a href="he.html" hreflang="he" class="he">עברית</a>
      <a href="ja.html" hreflang="ja" class="ja">日本語</a>
      <a href="zh.html" hreflang="zh" class="zh">中文</a>
    </nav>
  </main>
</body>
</html>
